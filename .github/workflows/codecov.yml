name: Codecov Coverage & Sentry Test Analytics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app  # This ensures all commands run in the /app directory
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
      - name: Generate test results in JUnit format
        run: |
          # Install jest-junit if not already available
          npm install --save-dev jest-junit
          # Run tests with JUnit output for better test analytics
          npx jest --coverage --testResultsProcessor=jest-junit --outputFile=test-results.xml
        continue-on-error: true  # Allow flaky tests to not fail the build
      - name: Upload test results to Sentry Test Analytics
        if: ${{ !cancelled() }}
        uses: getsentry/prevent-action
        with:
          token: ${{ secrets.SENTRY_PREVENT_TOKEN }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          slug: sfanahata/fitfest
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail CI if coverage upload fails
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        if: always()  # Run even if tests fail
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./
          slug: sfanahata/fitfest
          files: ./test-results.xml
          flags: test-results
          name: test-results
          fail_ci_if_error: false
